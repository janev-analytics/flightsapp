version: 2

models:
  - name: brz_raw_flights
    description: Bronze layer — direct view over the raw flights table with no transformations.
    columns:
      - name: icao24
        data_tests:
          - not_null
      - name: first_seen
        data_tests:
          - not_null:
              config:
                severity: warn
      - name: last_seen
        data_tests:
          - not_null
      - name: flight_direction
        data_tests:
          - accepted_values:
              arguments:
                values: ["arrival", "departure"]